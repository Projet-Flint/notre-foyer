<link rel="icon" type="image/png" id="lnkIcon" href="icons/icon-192.png">
<script>
// Logo choisi dans les Réglages (a, b ou c), appliqué avant tout le reste pour que « Sur l'écran d'accueil » le prenne.
function applyLogo(l) {
  if (!/^[abc]$/.test(l || '')) l = 'b';
  document.getElementById('lnkTouch').href = 'icons/icon-' + l + '-180.png';
  document.getElementById('lnkIcon').href = 'icons/icon-' + l + '-192.png';
  document.getElementById('lnkManifest').href = 'manifest-' + l + '.webmanifest';
}
try { applyLogo((JSON.parse(localStorage.getItem('notrefoyer.v1')) || {}).settings.logo); } catch (e) { applyLogo('b'); }
</script>
